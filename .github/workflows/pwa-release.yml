name: Build PWA to APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    name: Generate APK and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Uses Google's underlying Bubblewrap CLI to compile the APK
      - name: PWA to APK Action
        uses: sharadcodes/pwa-to-apk-action@v1.0.0
        with:
          # Replace this with the local folder where you initialized bubblewrap
          project-root-folder: '.' 

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
